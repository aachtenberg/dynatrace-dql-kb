# Agentic PR review from aachtenberg/agent-review: OpenCode on a read-only
# checkout of the PR, posting a short review as a comment. Runs when a PR is
# opened, reopened or marked ready, or when the owner comments /review.
# Public repo: GitHub-hosted runner, GLM 5.3 Flash via OpenRouter.
name: Agent Review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    # Same-repo PRs only, and /review only from the repo owner.
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.author_association == 'OWNER'
        && startsWith(github.event.comment.body, '/review'))
    uses: aachtenberg/agent-review/.github/workflows/review.yml@v1
    with:
      runner: ubuntu-latest
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
